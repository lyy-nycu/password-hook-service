name: cd

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: acrjpe001-byhkbaf5fxewe4ez.azurecr.io
  IMAGE_NAME: password-hook-service

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: image
        run: echo "tag=stg-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build -f deploy/Dockerfile \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.image.outputs.tag }}" .

      - name: Run Trivy image scan
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}"
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@c3d42c5d08633d8b33635fbd94b000a0e2585b3c # v3.31.4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif

      - name: Fail if the image has CRITICAL/HIGH/MEDIUM vulnerabilities
        if: steps.trivy-image.outcome == 'failure'
        run: exit 1

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name acrjpe001

      - name: Push image
        run: docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.image.outputs.tag }}"
