name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - run: go test ./... -coverprofile=coverage.out
      - run: go vet ./...
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '## Test coverage'
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: gosec -severity medium -fmt sarif -out gosec-results.sarif ./...
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c3d42c5d08633d8b33635fbd94b000a0e2585b3c # v3.31.4
        if: always()
        with:
          sarif_file: gosec-results.sarif
      - name: Fail if gosec found Medium/High issues
        if: steps.gosec.outcome == 'failure'
        run: exit 1
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c3d42c5d08633d8b33635fbd94b000a0e2585b3c # v3.31.4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
      - name: Fail if Trivy found CRITICAL/HIGH/MEDIUM issues
        if: steps.trivy.outcome == 'failure'
        run: exit 1
